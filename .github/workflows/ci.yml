name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DevPilot.sln

      - name: Build solution
        run: dotnet build DevPilot.sln --no-restore

      - name: Run tests
        run: dotnet test tests/DevPilot.Tests/DevPilot.Tests.csproj --no-restore

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/DevPilot.Web/package-lock.json

      - name: Install dependencies
        working-directory: src/DevPilot.Web
        run: npm ci

      - name: Build frontend
        working-directory: src/DevPilot.Web
        run: npm run build

